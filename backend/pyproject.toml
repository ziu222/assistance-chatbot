[project]
name = "assistance-chatbot-backend"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "redis>=8.1.0",
  "pyjwt[crypto]>=2.15.1",
  "argon2-cffi>=25.1.0",
  "prometheus-client>=0.26.0",
  "anthropic>=2.12.0",
  "openai>=3.57.0",
  "tzdata>=2026.6",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m 'not live'"
markers = ["live: gọi API provider thật (tốn tiền, cần key); chạy bằng `pytest -m live`"]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.package-data]
"app.modules.agent_management" = ["templates/*.toml"]
"app.modules.agent_runtime.llm" = ["routes.toml"]
