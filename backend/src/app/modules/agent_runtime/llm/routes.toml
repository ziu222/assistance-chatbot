# Route LLM (ADR-0015): tên logic -> danh sách đích THEO THỨ TỰ ưu tiên.
# Đổi thứ tự, thêm/bớt đích = sửa file này qua PR. Một đích chỉ nên vào route sau khi qua eval
# (bước 2.7); nếu không, failover sẽ âm thầm hạ chất lượng câu trả lời.
#
# effort chỉ áp dụng cho Anthropic. max_tokens gồm cả token suy nghĩ của model.

[[routes.classify.targets]]
provider = "anthropic"
model = "claude-sonnet-5"
effort = "low"
max_tokens = 2048

[[routes.classify.targets]]
provider = "openai"
model = "gpt-4.1-mini"
max_tokens = 512

[[routes.draft.targets]]
provider = "anthropic"
model = "claude-sonnet-5"
effort = "medium"
max_tokens = 4096

[[routes.draft.targets]]
provider = "openai"
model = "gpt-4.1"
max_tokens = 2048

# Giám khảo so sánh shadow (bước 3, thiết kế 04 §6): model KHÁC model soạn nháp để giảm thiên vị
# tự chấm. Chạy nền; bộ vàng backend/evals/judge/ phải qua trước khi đổi model hay prompt.
[[routes.judge.targets]]
provider = "anthropic"
model = "claude-sonnet-5-5"
effort = "medium"
max_tokens = 2048

[[routes.judge.targets]]
provider = "openai"
model = "gpt-4.1"
max_tokens = 512

# Trợ lý viết (bước 2.11): gợi ý luôn qua kiểm tra giữ sự thật bằng code và chủ shop duyệt trước
# khi lưu, nên đích chưa qua eval chỉ ảnh hưởng chất lượng câu chữ, không lọt tới khách.
# Haiku 5.5 qua gateway trả invalid_output với schema WritingOut (0/5, đo 2026-11-26) nên dùng
# Sonnet 5.5.
[[routes.authoring.targets]]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 2048

[[routes.authoring.targets]]
provider = "openai"
model = "gpt-4.1-mini"
max_tokens = 1024

# Học từ bản ghi sửa của nhân viên (bước 4 L3, thiết kế 05 §6.2), tách khỏi nháp và giám khảo.
# Haiku 5.5 qua gateway trả invalid_output với schema ứng viên (đo 2026-11-25) nên dùng Sonnet 5.5. Ứng viên luôn qua kiểm tra sự thật/PII/chữ khách bằng code, chủ shop duyệt và eval.
[[routes.learning.targets]]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 2048

[[routes.learning.targets]]
provider = "openai"
model = "gpt-4.1-mini"
max_tokens = 1024
