<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Atlas</title>
  <desc id="d">Atlas logo, a chat bubble drawn as a globe, with the tagline: AI customer-support agents with a human in the loop. Autonomy grows from Manual to Shadow to Learning to Autopilot.</desc>
  <style>
    .bg { fill: #f6f8f7; }
    .globe { stroke: #dde4e0; }
    .ink { fill: #17201c; }
    .muted { fill: #4f5b56; }
    .accent { fill: #0b6e4f; }
    .chip { fill: #ffffff; stroke: #cfd8d3; }
    .chip-on { fill: #0b6e4f; }
    .on-accent { fill: #ffffff; }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1512; }
      .globe { stroke: #1b2a24; }
      .ink { fill: #eef4f1; }
      .muted { fill: #a3b3ab; }
      .accent { fill: #3ecf9a; }
      .chip { fill: #121d19; stroke: #2a3b34; }
      .chip-on { fill: #3ecf9a; }
      .on-accent { fill: #0d1512; }
    }
  </style>
  <rect class="bg" width="1280" height="400"/>

  <!-- decorative globe, cropped on the right -->
  <g class="globe" fill="none" stroke-width="2">
    <circle cx="1120" cy="190" r="250"/>
    <ellipse cx="1120" cy="190" rx="120" ry="250"/>
    <ellipse cx="1120" cy="190" rx="215" ry="250"/>
    <line x1="870" y1="190" x2="1370" y2="190"/>
    <path d="M888 100 H1352 M888 280 H1352"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(80 64)">
    <rect class="accent" width="144" height="144" rx="36"/>
    <g stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="72" cy="66" r="38" stroke="#fff"/>
      <ellipse cx="72" cy="66" rx="16" ry="38" stroke="#fff"/>
      <line x1="34" y1="66" x2="110" y2="66" stroke="#fff"/>
      <path d="M44 42 H100 M44 90 H100" stroke="#fff" stroke-width="5"/>
    </g>
    <path d="M44 98 L30 124 L62 106 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <text class="ink" x="260" y="190" font-size="140" font-weight="800" letter-spacing="-4">Atlas</text>
  <text class="ink" x="84" y="268" font-size="42" font-weight="600">AI customer-support agents with a human in the loop</text>
  <text class="muted" x="84" y="316" font-size="30">Manual  →  Shadow  →  Learning  →  Autopilot</text>

  <g font-size="24" font-weight="600" text-anchor="middle">
    <rect class="chip" x="80" y="344" width="330" height="40" rx="20" stroke-width="1.5"/>
    <text class="ink" x="245" y="371">Grounded in your catalog</text>
    <rect class="chip" x="430" y="344" width="330" height="40" rx="20" stroke-width="1.5"/>
    <text class="ink" x="595" y="371">Shadow mode first</text>
    <rect class="chip" x="780" y="344" width="330" height="40" rx="20" stroke-width="1.5"/>
    <text class="ink" x="945" y="371">Claude + OpenAI failover</text>
  </g>
</svg>
